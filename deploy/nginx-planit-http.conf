# planit.radithyama.site on port 80: Let's Encrypt HTTP-01 challenges, everything else to HTTPS.
# Installed on its own first so the certificate can be issued without stopping nginx.
server {
    listen 80;
    listen [::]:80;
    server_name planit.radithyama.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://planit.radithyama.site$request_uri;
    }
}
