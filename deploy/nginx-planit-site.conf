# Planit at https://planit.radithyama.site (installed to /etc/nginx/sites-available/planit).
server {
    listen 80;
    listen [::]:80;
    server_name planit.radithyama.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://planit.radithyama.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name planit.radithyama.site;

    ssl_certificate     /etc/letsencrypt/live/planit.radithyama.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planit.radithyama.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://localhost:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include snippets/planit-proxy.conf;
    }
}
