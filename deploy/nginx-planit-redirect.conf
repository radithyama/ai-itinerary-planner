# Planit moved from radithyama.site/planit to its own subdomain; keep old links working.
# Installed to /etc/nginx/snippets/planit.conf, which the portfolio's HTTPS server block includes.
location = /planit {
    return 301 https://planit.radithyama.site/;
}

location ^~ /planit/ {
    rewrite ^/planit/(.*)$ https://planit.radithyama.site/$1 permanent;
}
