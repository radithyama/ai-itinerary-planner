# Planit, served at https://radithyama.site/planit.
# Installed to /etc/nginx/snippets/planit.conf and included from the portfolio's 443 server block.

location ^~ /planit/_next/static/ {
    proxy_pass http://localhost:3001;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /planit {
    include snippets/planit-proxy.conf;
}

location ^~ /planit/ {
    include snippets/planit-proxy.conf;
}
